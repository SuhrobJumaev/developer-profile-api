# This file created only for Backend DEVELOPERS not for CI-CD Don't use it DevOps!!!
version: "3.9"

services:
  # PostgreSQL Database service
  app-db:
    image: postgres:16.4
    volumes:
      - ./volumes/db-data:/var/lib/postgresql/data
    container_name: app-db
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: root
      POSTGRES_DB: app_db
    ports:
      - 5433:5432

    # Adminer for database
  app-adminer:
    image: adminer:latest
    container_name: app-adminer
    links:
      - app-db
    restart: always
    ports:
      - 8082:8080 # port for adminer 8082
    volumes:
      - ./database/adminer.css:/var/www/html/adminer.css # Mount the adminer style


networks:
  default:
    name: app-network
